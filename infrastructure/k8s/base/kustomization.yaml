apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: reales
resources:
  - namespace.yaml
  - configmap.yaml
  - web.yaml
  - worker.yaml
  - scheduler.yaml
  - migrate-job.yaml
  - network-policy.yaml
images:
  - name: reales
    newName: registry.example.com/reales   # replace with your registry
    newTag: latest                          # pin to an immutable tag/digest in every real environment
