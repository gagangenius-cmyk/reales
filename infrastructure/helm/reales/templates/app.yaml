apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
{{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
---
{{- range $role, $cmd := dict "worker" "worker" "scheduler" "scheduler" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
  labels:
    app: {{ $.Release.Name }}-{{ $role }}
spec:
  replicas: {{ (index $.Values $role).replicas }}
  {{- if eq $role "scheduler" }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ $.Release.Name }}-{{ $role }}
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}-{{ $role }}
    spec:
      {{- include "reales.podSecurity" $ | nindent 6 }}
      containers:
        - name: {{ $role }}
          image: {{ include "reales.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["npm", "run", {{ $cmd | quote }}]
          {{- include "reales.env" $ | nindent 10 }}
          resources:
            {{- toYaml (index $.Values $role).resources | nindent 12 }}
          {{- include "reales.containerSecurity" $ | nindent 10 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app: {{ .Release.Name }}-web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
    spec:
      {{- include "reales.podSecurity" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "reales.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["npm", "run", "start", "-w", "@reales/web"]
          ports:
            - name: http
              containerPort: 3000
          {{- include "reales.env" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          {{- include "reales.containerSecurity" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
spec:
  selector:
    app: {{ .Release.Name }}-web
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.web.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-web
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.web.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-web
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 12m
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web
                port:
                  number: 80
{{- end }}
{{- if .Values.migrations.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      {{- include "reales.podSecurity" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "reales.image" . }}
          command: ["npm", "run", "db:migrate"]
          {{- include "reales.env" . | nindent 10 }}
          {{- include "reales.containerSecurity" . | nindent 10 }}
{{- end }}
