# Ports are offset (3307/6380) so they don't collide with XAMPP MySQL or a local Redis.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: reales
      MYSQL_USER: reales
      MYSQL_PASSWORD: reales_dev_password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--log-bin-trust-function-creators=1"]
    ports: ["3307:3306"]
    volumes: ["mysql-data:/var/lib/mysql", "./mysql-init:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: ["redis-data:/data"]
  minio:
    profiles: ["storage"]  # opt-in: `docker compose --profile storage up`; dev defaults to a local filesystem driver
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reales
      MINIO_ROOT_PASSWORD: reales_dev_secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
volumes:
  mysql-data:
  redis-data:
  minio-data:
